[project]
name = "aegisml"
version = "0.1.0"
description = "ML reliability, drift monitoring, and incident-response platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
